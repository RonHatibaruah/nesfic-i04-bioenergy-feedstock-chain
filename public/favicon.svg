<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <!-- Gradient Definitions -->
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#064e3b"/>
      <stop offset="50%" stop-color="#047857"/>
      <stop offset="100%" stop-color="#065f46"/>
    </linearGradient>
    <linearGradient id="flameGrad" x1="0%" y1="100%" x2="50%" y2="0%">
      <stop offset="0%" stop-color="#ea580c"/>
      <stop offset="50%" stop-color="#f97316"/>
      <stop offset="100%" stop-color="#facc15"/>
    </linearGradient>
    <linearGradient id="leafGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#15803d"/>
      <stop offset="50%" stop-color="#22c55e"/>
      <stop offset="100%" stop-color="#4ade80"/>
    </linearGradient>
    <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
  </defs>

  <!-- Background App Icon Badge -->
  <rect width="64" height="64" rx="16" fill="url(#bgGrad)"/>
  <rect x="1" y="1" width="62" height="62" rx="15" stroke="#34d399" stroke-width="1.5" stroke-opacity="0.3"/>

  <!-- Circular Bio-economy & LoRaWAN Radio Wave Orbit -->
  <circle cx="32" cy="32" r="25" stroke="url(#ringGrad)" stroke-width="1.5" stroke-dasharray="3 3" opacity="0.45"/>
  <circle cx="32" cy="32" r="19" stroke="#34d399" stroke-width="1.2" opacity="0.3"/>

  <!-- Biomass Sprout (Left Leaf - Bamboo / Paddy Straw) -->
  <path d="M30 46 C24 45, 16 38, 17 28 C 24 28, 30 33, 31 40 Z" fill="url(#leafGrad)"/>
  <path d="M21 34 C 25 36, 28 39, 30 43" stroke="#bbf7d0" stroke-width="1.2" stroke-linecap="round"/>

  <!-- Bioenergy Clean Flame (Center Right - 2G Bioethanol / Green Power) -->
  <path d="M31 46 C 30 38, 33 32, 38 27 C 40 31, 44 32, 45 28 C 48 34, 47 41, 41 45 C 38 47, 34 47, 31 46 Z" fill="url(#flameGrad)"/>
  <!-- Inner Flame Core -->
  <path d="M34 45 C 33 40, 36 36, 39 33 C 41 37, 43 38, 41 43 C 39 45, 36 46, 34 45 Z" fill="#fef08a"/>

  <!-- Stem & Smart IoT Root Core -->
  <path d="M30 46 L 31 52" stroke="#10b981" stroke-width="2.5" stroke-linecap="round"/>
  
  <!-- Active Telemetry Probe Pulse Dot -->
  <circle cx="45" cy="18" r="2.5" fill="#38bdf8"/>
  <circle cx="45" cy="18" r="5" stroke="#38bdf8" stroke-width="1" opacity="0.6"/>
</svg>
